services:
  postgres:
    image: postgres:15-alpine
    container_name: raven-postgres
    environment:
      POSTGRES_USER: raven
      POSTGRES_PASSWORD: raven
      POSTGRES_DB: raven
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [raven]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raven -d raven"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: raven-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb"]
    volumes:
      - redisdata:/data
    networks: [raven]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 320M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: raven-backend
    environment:
      DATABASE_URL: postgresql+psycopg2://raven:raven@postgres:5432/raven
      REDIS_URL: redis://redis:6379/0
      SCAN_QUEUE_KEY: raven:scan-queue
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      DEMO_MODE: ${DEMO_MODE:-false}
      SCANNER_TIMEOUT: ${SCANNER_TIMEOUT:-1200}
      SCAN_TIMEOUT_FAST: ${SCAN_TIMEOUT_FAST:-300}
      SCAN_TIMEOUT_DEEP: ${SCAN_TIMEOUT_DEEP:-600}
      NUCLEI_TIMEOUT: ${NUCLEI_TIMEOUT:-300}
      SKIP_MIGRATIONS: ${SKIP_MIGRATIONS:-false}
      CORS_ORIGINS: '${CORS_ORIGINS:-["*"]}'
      API_KEY: ${API_KEY:-}
      API_RATE_LIMIT: ${API_RATE_LIMIT:-true}
      API_RATE_LIMIT_RPM: ${API_RATE_LIMIT_RPM:-120}
      SCAN_RATE_LIMIT_RPM: ${SCAN_RATE_LIMIT_RPM:-20}
      SCAN_CONCURRENCY: ${SCAN_CONCURRENCY:-2}
      REQUEST_RATE_LIMIT: ${REQUEST_RATE_LIMIT:-10}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      OAST_PUBLIC_URL: ${OAST_PUBLIC_URL:-}
      OAST_ALLOW_HTTP: ${OAST_ALLOW_HTTP:-false}
      SCAN_HEADERS: '${SCAN_HEADERS:-}'
      SCAN_COOKIE: '${SCAN_COOKIE:-}'
    volumes:
      - raven_data:/app/data
    networks: [raven]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    container_name: raven-frontend
    environment:
      BACKEND_URL: http://backend:8000
    networks: [raven]
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  raven_data:

networks:
  raven:
    driver: bridge
