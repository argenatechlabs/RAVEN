services:
  postgres:
    image: postgres:15-alpine
    container_name: raven-postgres
    environment:
      POSTGRES_USER: raven
      POSTGRES_PASSWORD: raven
      POSTGRES_DB: raven
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [raven]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raven -d raven"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: raven-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks: [raven]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: raven-backend
    environment:
      DATABASE_URL: postgresql+psycopg2://raven:raven@postgres:5432/raven
      REDIS_URL: redis://redis:6379/0
      SCAN_QUEUE_KEY: raven:scan-queue
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      DEMO_MODE: ${DEMO_MODE:-false}
      SCANNER_TIMEOUT: ${SCANNER_TIMEOUT:-1200}
      CORS_ORIGINS: '["*"]'
    volumes:
      - raven_data:/app/data
    networks: [raven]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    container_name: raven-frontend
    environment:
      BACKEND_URL: http://backend:8000
    networks: [raven]
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  raven_data:

networks:
  raven:
    driver: bridge
