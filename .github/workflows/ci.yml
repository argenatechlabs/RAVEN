name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DEMO_MODE: "true"
      SCANNER_BIN_DIR: /nonexistent
      API_RATE_LIMIT: "false"
      DATABASE_URL: sqlite:///./data/ci.db
      DATA_DIR: ./data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Compile check
        working-directory: backend
        run: python -m compileall -q app

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: raven
          POSTGRES_PASSWORD: raven
          POSTGRES_DB: raven_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U raven -d raven_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://raven:raven@127.0.0.1:5432/raven_test
      DEMO_MODE: "true"
      SCANNER_BIN_DIR: /nonexistent
      API_RATE_LIMIT: "false"
      DATA_DIR: ./data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Test pipeline persistence on PostgreSQL
        working-directory: backend
        run: python -m pytest tests/test_pipeline.py tests/test_client_inventory.py tests/test_reconstruction.py tests/test_review_and_probes.py tests/test_active_checks.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          BACKEND_URL: http://127.0.0.1:8000
        run: npm run build
